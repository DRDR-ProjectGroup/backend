input {
    file {
        # logback 로그파일
        path => "/logs/*.log"
        # 처음부터 읽기 설정
        start_position => "beginning"
        # 재시작 시 다시 읽게 설정
        sincedb_path => "/dev/null"
        codec => plain {
            charset => "UTF-8"
        }
    }
}

filter {
    grok {
        match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:thread}\] %{LOGLEVEL:level}\s+%{DATA:logger} - %{GREEDYDATA:log_message}" }
    }
    date {
        match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
        timezone => "Asia/Seoul"
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "dorandoran-logs-%{+yyyy.MM.dd}"
    }
    stdout {
        codec => rubydebug
    }
}